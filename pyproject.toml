[project]
name = "cmn-c2-718"
version = "1.0.0"
description = "ProjectProgressReportAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# installed from the platform's own package registry at build time. Pinning it
# here would make `pip install -e .` fail, because it is not resolvable from
# the default index.
# pyyaml is a real runtime dependency: PB-7 imports it to read config/config.yaml
# when checking hitl.enabled.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-PyYAML==6.0.12.20260815",  # official stub package for PyYAML — not a hand-written .pyi
]

[build-system]
requires = ["setuptools==68.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# The installed agenticstar-agentcore wheel ships no py.typed marker, so every
# framework/shared import is untyped and each node class inherits from an implicit Any.
# Under `strict` that produces import-untyped and misc errors this template cannot fix:
# writing local .pyi stubs for a third-party SDK is prohibited (they drift from the real
# package and produce a "0 errors" that is simply wrong). The two settings below scope the
# exemption to exactly that cause and leave every check on our own code enabled.
ignore_missing_imports = true
disallow_subclassing_any = false
