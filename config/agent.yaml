# Agent Manifest — AgentRegistry entry point
# The registry reads every key below at ROOT level — do NOT nest keys under an
# `agent:` block. That nested shape is invisible to the registry: name/version
# never resolve, namespace and enabled silently fall back to their defaults, and
# the registry key collapses to the collision-prone `default/unknown@latest`.
id: "CMN-C2-718"
name: "ProjectProgressReportAgent"
namespace: "cmn"
version: "1.0.0"
enabled: true
category: "Cat 2"
# Static generation contract. Omitted by legacy templates defaults to deterministic.
generation_mode: "llm"  # deterministic | llm
industry: "CMN"

# Opaque compatibility metadata. It is not an inheritance selector or gate input.
base_type: "AgentBaseGraph"

# Entry point — single dotted import path (module.Class), NOT split module:/class:.
# AgentRegistry does `manifest["class"].rsplit(".", 1)` to get (module, class_name).
class: "src.graph.graph.ProjectProgressReportGraph"

# Security
required_trust_level: "VERIFIED_EXTERNAL"

# Compile-time gates (AgentRegistry._compile_and_cache) for fixed dependencies.
# The LLM instance is injected by the platform, so this template declares no
# provider-specific key or optional provider extra. Source-set credentials are
# selected at runtime and fail closed at the source boundary when unavailable.
requires:
  secrets: []      # source-specific names are selected and required at invocation time
  extras: []

# generation_mode is deployment identity, not a tunable provider setting. Runtime parameters
# (max_retry, timeout_s, hitl, memory_enabled, ...) live in
# config/config.yaml — AgentRegistry loads that file separately and passes it
# as Graph(config=...). Do NOT put them here.
